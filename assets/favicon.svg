<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- SpaceHub logo: a planet with a tilted orbit and a satellite -->
  <defs>
    <linearGradient id="sh-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#0c1322"/>
    </linearGradient>
    <linearGradient id="sh-planet" x1="0.25" y1="0.1" x2="0.75" y2="0.95">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#sh-tile)"/>

  <!-- Small stars -->
  <circle cx="14" cy="15" r="1.5" fill="#e2e8f0" opacity="0.8"/>
  <circle cx="50" cy="11" r="1.1" fill="#e2e8f0" opacity="0.6"/>
  <circle cx="11" cy="47" r="1" fill="#e2e8f0" opacity="0.5"/>

  <!-- Back half of the orbit (behind the planet) -->
  <g transform="rotate(-24 32 32)">
    <path d="M7 32 A25 9 0 0 1 57 32" fill="none" stroke="#60a5fa" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Planet -->
  <circle cx="32" cy="32" r="13" fill="url(#sh-planet)"/>
  <path d="M23 26 A12 12 0 0 1 33 20.2" fill="none" stroke="#dbeafe" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>

  <!-- Front half of the orbit and the satellite -->
  <g transform="rotate(-24 32 32)">
    <path d="M7 32 A25 9 0 0 0 57 32" fill="none" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
    <circle cx="48.1" cy="38.9" r="3.4" fill="#22d3ee" stroke="#0c1322" stroke-width="1.4"/>
  </g>
</svg>
