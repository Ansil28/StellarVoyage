<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" font-family="Inter, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Flight stages of a launch to orbit</title>
<desc id="d">Trajectory of a two-stage rocket from liftoff to orbit with the main events marked, the first stage returning to a drone ship, and a timeline for a typical Falcon 9 Starlink launch.</desc>
<defs><marker id="aA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ff922b"/></marker><marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#91a7ff"/></marker>
<clipPath id="card"><rect width="1100" height="660" rx="18"/></clipPath>
<linearGradient id="atm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c7ed6" stop-opacity="0"/><stop offset="1" stop-color="#1c7ed6" stop-opacity="0.35"/></linearGradient>
</defs>
<g clip-path="url(#card)">
<rect width="1100" height="660" fill="#0b1628"/>
<rect x="0" y="320" width="1100" height="240" fill="url(#atm)"/>
<rect x="0" y="560" width="300" height="100" fill="#1d2b22"/><rect x="300" y="560" width="800" height="100" fill="#123a5c"/>
</g>
<line x1="30" y1="345" x2="820" y2="345" stroke="#8fa3bf" stroke-width="1" stroke-dasharray="5 6" opacity="0.7"/>
<text x="36" y="337" fill="#8fa3bf" font-size="12">~100 km: edge of space</text>
<text x="40" y="50" fill="#e6edf7" font-size="26" font-weight="700">Flight Stages</text>
<text x="40" y="76" fill="#8fa3bf" font-size="15">From liftoff to orbit, and the first stage's way back (not to scale)</text>

<rect x="102" y="548" width="16" height="12" fill="#495057"/><text x="110" y="582" fill="#8fa3bf" font-size="12" text-anchor="middle">Launch pad</text>
<rect x="569" y="552" width="42" height="8" rx="2" fill="#495057"/><text x="590" y="582" fill="#8fa3bf" font-size="12" text-anchor="middle">Drone ship</text>
<path d="M380,400 C440,370 490,375 520,410" fill="none" stroke="#91a7ff" stroke-width="3"/>
<path d="M520,410 C550,450 575,500 590,550" fill="none" stroke="#91a7ff" stroke-width="3" marker-end="url(#aB)"/>
<path d="M110,560 C115,480 200,415 380,400" fill="none" stroke="#ff922b" stroke-width="4"/>
<path d="M380,400 C540,365 660,160 760,140" fill="none" stroke="#ff922b" stroke-width="4"/>
<line x1="760" y1="140" x2="830" y2="140" stroke="#ff922b" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#aA)"/>
<line x1="380" y1="406" x2="372" y2="444" stroke="#8fa3bf" stroke-width="1"/>
<circle cx="110.0" cy="560.0" r="6" fill="#0b1628" stroke="#ff922b" stroke-width="3"/>
<circle cx="120.6" cy="518.5" r="6" fill="#0b1628" stroke="#ff922b" stroke-width="3"/>
<circle cx="193.3" cy="447.4" r="6" fill="#0b1628" stroke="#ff922b" stroke-width="3"/>
<circle cx="380.0" cy="400.0" r="6" fill="#0b1628" stroke="#ff922b" stroke-width="3"/>
<circle cx="513.7" cy="332.2" r="6" fill="#0b1628" stroke="#ff922b" stroke-width="3"/>
<circle cx="760.0" cy="140.0" r="6" fill="#0b1628" stroke="#ff922b" stroke-width="3"/>
<text x="124.0" y="554.0" fill="#e6edf7" font-size="13.5" font-weight="600" text-anchor="start">Liftoff</text>
<text x="134.6" y="518.5" fill="#e6edf7" font-size="13.5" font-weight="600" text-anchor="start">Pitch-over</text>
<text x="134.6" y="534.5" fill="#8fa3bf" font-size="11.5" text-anchor="start">start of the gravity turn</text>
<text x="173.3" y="443.4" fill="#e6edf7" font-size="13.5" font-weight="600" text-anchor="end">Max-Q</text>
<text x="173.3" y="459.4" fill="#8fa3bf" font-size="11.5" text-anchor="end">peak air pressure</text>
<text x="370.0" y="460.0" fill="#e6edf7" font-size="13.5" font-weight="600" text-anchor="end">Stage separation</text>
<text x="370.0" y="476.0" fill="#8fa3bf" font-size="11.5" text-anchor="end">MECO + 2nd-stage ignition</text>
<text x="499.7" y="316.2" fill="#e6edf7" font-size="13.5" font-weight="600" text-anchor="end">Fairing separation</text>
<text x="499.7" y="332.2" fill="#8fa3bf" font-size="11.5" text-anchor="end">above the thick air</text>
<text x="748.0" y="124.0" fill="#e6edf7" font-size="13.5" font-weight="600" text-anchor="end">SECO</text>
<text x="748.0" y="140.0" fill="#8fa3bf" font-size="11.5" text-anchor="end">engine cut-off</text>
<circle cx="810.0" cy="140.0" r="6" fill="#0b1628" stroke="#ff922b" stroke-width="3"/>
<text x="810.0" y="112.0" fill="#e6edf7" font-size="13.5" font-weight="600" text-anchor="middle">Payload</text>
<text x="810.0" y="128.0" fill="#8fa3bf" font-size="11.5" text-anchor="middle">deployed</text>
<circle cx="533.1" cy="428.6" r="6" fill="#0b1628" stroke="#91a7ff" stroke-width="3"/>
<text x="547.1" y="432.6" fill="#91a7ff" font-size="13.5" font-weight="600" text-anchor="start">Entry burn</text>
<text x="547.1" y="448.6" fill="#8fa3bf" font-size="11.5" text-anchor="start">slows down before thick air</text>
<circle cx="582.6" cy="527.5" r="6" fill="#0b1628" stroke="#91a7ff" stroke-width="3"/>
<text x="596.6" y="527.5" fill="#91a7ff" font-size="13.5" font-weight="600" text-anchor="start">Landing burn</text>
<text x="596.6" y="543.5" fill="#8fa3bf" font-size="11.5" text-anchor="start">touches down at zero speed</text>
<rect x="850" y="110" width="225" height="300" rx="12" fill="#12233d" stroke="#24406a" stroke-width="1.5"/>
<text x="866" y="136" fill="#e6edf7" font-size="14" font-weight="700">Falcon 9 timeline</text>
<text x="866" y="153" fill="#8fa3bf" font-size="11.5">Starlink launch, approximate</text>
<circle cx="870" cy="174" r="3.5" fill="#ff922b"/><text x="880" y="178" fill="#e6edf7" font-size="12" font-weight="600">T−0:03</text><text x="942" y="178" fill="#8fa3bf" font-size="12">Engine ignition</text>
<circle cx="870" cy="193" r="3.5" fill="#ff922b"/><text x="880" y="197" fill="#e6edf7" font-size="12" font-weight="600">T+0:00</text><text x="942" y="197" fill="#8fa3bf" font-size="12">Liftoff</text>
<circle cx="870" cy="212" r="3.5" fill="#ff922b"/><text x="880" y="216" fill="#e6edf7" font-size="12" font-weight="600">T+1:12</text><text x="942" y="216" fill="#8fa3bf" font-size="12">Max-Q</text>
<circle cx="870" cy="231" r="3.5" fill="#ff922b"/><text x="880" y="235" fill="#e6edf7" font-size="12" font-weight="600">T+2:27</text><text x="942" y="235" fill="#8fa3bf" font-size="12">MECO</text>
<circle cx="870" cy="250" r="3.5" fill="#ff922b"/><text x="880" y="254" fill="#e6edf7" font-size="12" font-weight="600">T+2:31</text><text x="942" y="254" fill="#8fa3bf" font-size="12">Stage separation</text>
<circle cx="870" cy="269" r="3.5" fill="#ff922b"/><text x="880" y="273" fill="#e6edf7" font-size="12" font-weight="600">T+2:37</text><text x="942" y="273" fill="#8fa3bf" font-size="12">2nd-stage ignition</text>
<circle cx="870" cy="288" r="3.5" fill="#ff922b"/><text x="880" y="292" fill="#e6edf7" font-size="12" font-weight="600">T+2:42</text><text x="942" y="292" fill="#8fa3bf" font-size="12">Fairing separation</text>
<circle cx="870" cy="307" r="3.5" fill="#91a7ff"/><text x="880" y="311" fill="#e6edf7" font-size="12" font-weight="600">T+6:46</text><text x="942" y="311" fill="#8fa3bf" font-size="12">Entry burn</text>
<circle cx="870" cy="326" r="3.5" fill="#91a7ff"/><text x="880" y="330" fill="#e6edf7" font-size="12" font-weight="600">T+8:23</text><text x="942" y="330" fill="#8fa3bf" font-size="12">Landing burn</text>
<circle cx="870" cy="345" r="3.5" fill="#ff922b"/><text x="880" y="349" fill="#e6edf7" font-size="12" font-weight="600">T+8:42</text><text x="942" y="349" fill="#8fa3bf" font-size="12">SECO</text>
<circle cx="870" cy="364" r="3.5" fill="#91a7ff"/><text x="880" y="368" fill="#e6edf7" font-size="12" font-weight="600">T+8:45</text><text x="942" y="368" fill="#8fa3bf" font-size="12">Booster lands</text>
<circle cx="870" cy="383" r="3.5" fill="#ff922b"/><text x="880" y="387" fill="#e6edf7" font-size="12" font-weight="600">T+29:03</text><text x="942" y="387" fill="#8fa3bf" font-size="12">Payload deployed</text>
<rect x="850" y="428" width="225" height="108" rx="12" fill="#12233d" stroke="#24406a" stroke-width="1.5"/>
<text x="866" y="454" fill="#91a7ff" font-size="13.5" font-weight="700">Landing back on land?</text>
<text x="866" y="474" fill="#8fa3bf" font-size="12">The booster first flips and fires</text>
<text x="866" y="490" fill="#8fa3bf" font-size="12">a boostback burn to reverse</text>
<text x="866" y="506" fill="#8fa3bf" font-size="12">direction, then does the same</text>
<text x="866" y="522" fill="#8fa3bf" font-size="12">entry and landing burns.</text>
<line x1="40" y1="630" x2="66" y2="630" stroke="#ff922b" stroke-width="4"/><text x="74" y="634" fill="#e6edf7" font-size="12">Rocket to orbit</text>
<line x1="200" y1="630" x2="226" y2="630" stroke="#91a7ff" stroke-width="3"/><text x="234" y="634" fill="#e6edf7" font-size="12">First stage returning</text>
</svg>