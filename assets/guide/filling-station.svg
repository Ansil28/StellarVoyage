<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Inter, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Filling station schematic</title>
<desc id="d">Schematic of a nitrous oxide filling station for a student hybrid rocket: supply bottle on a load cell, nitrogen purge line, manual, check, fill, dump and relief valves, pressure sensors, quick disconnect, rocket tank with vent, a pad box and a remote control station.</desc>
