<text x="234" y="531.0" fill="#e6edf7" font-size="15" font-weight="700" text-anchor="end">First stage</text>
<circle cx="363" cy="140" r="2.5" fill="#e6edf7"/><polyline points="363,140 416,128 424,128" fill="none" stroke="#8fa3bf" stroke-width="1"/>
<text x="430" y="126" fill="#e6edf7" font-size="13">Payload fairing</text><text x="430" y="141" fill="#8fa3bf" font-size="11.5">jettisoned once above the atmosphere</text>
<circle cx="340" cy="178" r="2.5" fill="#e6edf7"/><polyline points="340,178 416,172 424,172" fill="none" stroke="#8fa3bf" stroke-width="1"/>
<text x="430" y="170" fill="#e6edf7" font-size="13">Payload</text><text x="430" y="185" fill="#8fa3bf" font-size="11.5">satellite or spacecraft</text>
<circle cx="346" cy="208" r="2.5" fill="#e6edf7"/><polyline points="346,208 416,216 424,216" fill="none" stroke="#8fa3bf" stroke-width="1"/>
<text x="430" y="214" fill="#e6edf7" font-size="13">Payload adapter</text><text x="430" y="229" fill="#8fa3bf" font-size="11.5">holds and releases the payload</text>
<circle cx="356" cy="237" r="2.5" fill="#e6edf7"/><polyline points="356,237 416,260 424,260" fill="none" stroke="#8fa3bf" stroke-width="1"/>
<text x="430" y="258" fill="#e6edf7" font-size="13">Avionics</text><text x="430" y="273" fill="#8fa3bf" font-size="11.5">flight computer, IMU, GPS</text>
<circle cx="356" cy="268" r="2.5" fill="#e6edf7"/><polyline points="356,268 416,304 424,304" fill="none" stroke="#8fa3bf" stroke-width="1"/>
<text x="430" y="302" fill="#e6edf7" font-size="13">Upper-stage tanks</text><text x="430" y="317" fill="#8fa3bf" font-size="11.5">fuel and oxidizer, common bulkhead</text>
<circle cx="378" cy="360" r="2.5" fill="#e6edf7"/><polyline points="378,360 416,348 424,348" fill="none" stroke="#8fa3bf" stroke-width="1"/>
<text x="430" y="346" fill="#e6edf7" font-size="13">Grid fins</text><text x="430" y="361" fill="#8fa3bf" font-size="11.5">steer the booster on the way back</text>
<circle cx="352" cy="404" r="2.5" fill="#e6edf7"/><polyline points="352,404 416,392 424,392" fill="none" stroke="#8fa3bf" stroke-width="1"/>
<text x="430" y="390" fill="#e6edf7" font-size="13">Vacuum engine</text><text x="430" y="405" fill="#8fa3bf" font-size="11.5">large nozzle for thin air</text>
<circle cx="362" cy="416" r="2.5" fill="#e6edf7"/><polyline points="362,416 416,436 424,436" fill="none" stroke="#8fa3bf" stroke-width="1"/>
<text x="430" y="434" fill="#e6edf7" font-size="13">Interstage</text><text x="430" y="449" fill="#8fa3bf" font-size="11.5">joins stages, holds separation system</text>
<circle cx="357" cy="470" r="2.5" fill="#e6edf7"/><polyline points="357,470 416,480 424,480" fill="none" stroke="#8fa3bf" stroke-width="1"/>
<text x="430" y="478" fill="#e6edf7" font-size="13">Oxidizer tank</text><text x="430" y="493" fill="#8fa3bf" font-size="11.5">liquid oxygen</text>
<circle cx="348" cy="500" r="2.5" fill="#e6edf7"/><polyline points="348,500 416,524 424,524" fill="none" stroke="#8fa3bf" stroke-width="1"/>
<text x="430" y="522" fill="#e6edf7" font-size="13">Helium tanks</text><text x="430" y="537" fill="#8fa3bf" font-size="11.5">keep the tanks pressurised</text>
<circle cx="322" cy="570" r="2.5" fill="#e6edf7"/><polyline points="322,570 416,568 424,568" fill="none" stroke="#8fa3bf" stroke-width="1"/>
<text x="430" y="566" fill="#e6edf7" font-size="13">Feedline</text><text x="430" y="581" fill="#8fa3bf" font-size="11.5">carries oxygen through the fuel tank</text>
<circle cx="357" cy="610" r="2.5" fill="#e6edf7"/><polyline points="357,610 416,612 424,612" fill="none" stroke="#8fa3bf" stroke-width="1"/>
<text x="430" y="610" fill="#e6edf7" font-size="13">Fuel tank</text><text x="430" y="625" fill="#8fa3bf" font-size="11.5">e.g. kerosene</text>
<circle cx="367" cy="665" r="2.5" fill="#e6edf7"/><polyline points="367,665 416,656 424,656" fill="none" stroke="#8fa3bf" stroke-width="1"/>
<text x="430" y="654" fill="#e6edf7" font-size="13">Landing legs</text><text x="430" y="669" fill="#8fa3bf" font-size="11.5">folded during ascent</text>
<circle cx="350" cy="700" r="2.5" fill="#e6edf7"/><polyline points="350,700 416,700 424,700" fill="none" stroke="#8fa3bf" stroke-width="1"/>
<text x="430" y="698" fill="#e6edf7" font-size="13">Engines</text><text x="430" y="713" fill="#8fa3bf" font-size="11.5">gimbal to steer (thrust vector control)</text>
<text x="735" y="132" fill="#e6edf7" font-size="15" font-weight="700">Liftoff mass</text>
<rect x="735" y="150" width="34" height="486.0" fill="#4dabf7"/>
<rect x="735" y="636.0" width="34" height="35.1" fill="#adb5bd"/>
<rect x="735" y="671.1" width="34" height="18.900000000000002" fill="#ffd43b"/>
<rect x="735" y="150" width="34" height="540" fill="none" stroke="#8fa3bf" stroke-width="1"/>
<text x="779" y="393.0" fill="#e6edf7" font-size="13" font-weight="600">Propellant</text><text x="779" y="409.0" fill="#8fa3bf" font-size="12">about 90%</text>
<text x="779" y="638.2" fill="#e6edf7" font-size="13" font-weight="600">Structure</text><text x="779" y="654.2" fill="#8fa3bf" font-size="12">about 6–8%</text>
<text x="779" y="688" fill="#e6edf7" font-size="13" font-weight="600">Payload</text><text x="779" y="704" fill="#8fa3bf" font-size="12">about 2–4%</text>
<text x="735" y="738" fill="#8fa3bf" font-size="11.5">Falcon 9: 549 t at liftoff,</text><text x="735" y="753" fill="#8fa3bf" font-size="11.5">up to 22.8 t to orbit</text>
</svg>