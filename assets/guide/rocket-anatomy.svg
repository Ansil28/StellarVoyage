<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" font-family="Inter, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Anatomy of a two-stage rocket</title>
<desc id="d">Cutaway of a two-stage rocket showing the payload fairing, payload, avionics, upper-stage tanks and vacuum engine, interstage, grid fins, first-stage tanks, helium tanks, feedline, landing legs and engines, with a bar showing how liftoff mass is split.</desc>
<rect width="900" height="780" rx="18" fill="#0b1628"/>
<text x="40" y="50" fill="#e6edf7" font-size="26" font-weight="700">Rocket Anatomy</text>
<text x="40" y="76" fill="#8fa3bf" font-size="15">Cutaway of a typical two-stage, reusable rocket</text>

