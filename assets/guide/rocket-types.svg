<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="Inter, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Types of chemical rockets</title>
<desc id="d">Cutaway diagrams of a solid, a liquid and a hybrid rocket, showing where fuel and oxidizer are stored.</desc>
<defs>
<linearGradient id="flame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3bf"/><stop offset="0.35" stop-color="#ffa94d"/><stop offset="1" stop-color="#f03e3e" stop-opacity="0"/></linearGradient>
<pattern id="mix" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#c2873c"/><circle cx="2" cy="2" r="1.3" fill="#ff922b"/><circle cx="6" cy="6" r="1.3" fill="#4dabf7"/></pattern>
</defs>
<rect width="900" height="650" rx="18" fill="#0b1628"/>
<text x="40" y="50" fill="#e6edf7" font-size="26" font-weight="700">Types of Chemical Rockets</text>
<text x="40" y="76" fill="#8fa3bf" font-size="15">Where the fuel and oxidizer are stored, and how they meet</text>

<rect x="600" y="38" width="14" height="14" rx="3" fill="#ff922b"/><text x="622" y="50" fill="#8fa3bf" font-size="13">Fuel</text>
<rect x="600" y="58" width="14" height="14" rx="3" fill="#4dabf7"/><text x="622" y="70" fill="#8fa3bf" font-size="13">Oxidizer</text>
<rect x="600" y="78" width="14" height="14" rx="3" fill="url(#mix)"/><text x="622" y="90" fill="#8fa3bf" font-size="13">Fuel + oxidizer mixed</text>
<rect x="30" y="105" width="270" height="525" rx="14" fill="#101f36" stroke="#22395c" stroke-width="1.5"/>
<text x="50" y="138" fill="#e6edf7" font-size="20" font-weight="700">Solid</text>
<text x="50" y="158" fill="#8fa3bf" font-size="12.5">Propellant mixed and cast as one block</text>
<path d="M75,205 C75,183 98,178 110,170 C122,178 145,183 145,205 Z" fill="#c92a2a"/>
<rect x="75" y="205" width="70" height="250" fill="#c7d0dc"/>
<rect x="81" y="211" width="58" height="244" fill="url(#mix)"/>
<rect x="102" y="222" width="16" height="233" fill="#0b1628"/>
<line x1="102" y1="222" x2="102" y2="455" stroke="#ff922b" stroke-width="2.5"/><line x1="118" y1="222" x2="118" y2="455" stroke="#ff922b" stroke-width="2.5"/>
<rect x="104" y="214" width="12" height="8" fill="#ffd43b"/>
<path d="M96.0,455 L80.0,490 L140.0,490 L124.0,455 Z" fill="#5c6b80"/>
<path d="M86.0,492 Q80.0,535 110,565 Q140.0,535 134.0,492 Z" fill="url(#flame)"/>
<circle cx="116" cy="218" r="2.5" fill="#e6edf7"/><polyline points="116,218 166,200 174,200" fill="none" stroke="#8fa3bf" stroke-width="1"/>
<text x="180" y="204" fill="#e6edf7" font-size="12.5">Igniter</text>
<circle cx="145" cy="250" r="2.5" fill="#e6edf7"/><polyline points="145,250 166,250 174,250" fill="none" stroke="#8fa3bf" stroke-width="1"/>
<text x="180" y="254" fill="#e6edf7" font-size="12.5">Casing</text>
<circle cx="130" cy="320" r="2.5" fill="#e6edf7"/><polyline points="130,320 166,320 174,320" fill="none" stroke="#8fa3bf" stroke-width="1"/>
<text x="180" y="317" fill="#e6edf7" font-size="12.5">Propellant grain</text>
<text x="180" y="332" fill="#8fa3bf" font-size="11.5">burns until used up</text>
<circle cx="118" cy="400" r="2.5" fill="#e6edf7"/><polyline points="118,400 166,400 174,400" fill="none" stroke="#8fa3bf" stroke-width="1"/>
<text x="180" y="397" fill="#e6edf7" font-size="12.5">Burning core</text>
<text x="180" y="412" fill="#8fa3bf" font-size="11.5">shape sets the thrust</text>
<circle cx="132" cy="475" r="2.5" fill="#e6edf7"/><polyline points="132,475 166,475 174,475" fill="none" stroke="#8fa3bf" stroke-width="1"/>
<text x="180" y="479" fill="#e6edf7" font-size="12.5">Nozzle</text>
<line x1="50" y1="572" x2="280" y2="572" stroke="#22395c"/>
<text x="50" y="594" fill="#8fa3bf" font-size="13">Specific impulse</text><text x="280" y="594" fill="#e6edf7" font-size="13" font-weight="600" text-anchor="end">~250–290 s</text>
<text x="50" y="614" fill="#8fa3bf" font-size="13">Throttle / restart</text><text x="280" y="614" fill="#e6edf7" font-size="13" font-weight="600" text-anchor="end">No</text>
<rect x="315" y="105" width="270" height="525" rx="14" fill="#101f36" stroke="#22395c" stroke-width="1.5"/>
<text x="335" y="138" fill="#e6edf7" font-size="20" font-weight="700">Liquid</text>
<text x="335" y="158" fill="#8fa3bf" font-size="12.5">Separate tanks, fed into an engine</text>
<path d="M360,205 C360,183 383,178 395,170 C407,178 430,183 430,205 Z" fill="#c92a2a"/>
<rect x="360" y="205" width="70" height="205" fill="#c7d0dc"/>
<rect x="366" y="211" width="58" height="88" rx="10" fill="#ff922b"/>
<rect x="366" y="308" width="58" height="96" rx="10" fill="#4dabf7"/>
<path d="M375,299 L375,425 L385,425" fill="none" stroke="#ff922b" stroke-width="4"/>
<path d="M403,404 L403,418" fill="none" stroke="#4dabf7" stroke-width="4"/>
<circle cx="395" cy="427" r="11" fill="#868e96" stroke="#c7d0dc" stroke-width="2"/>
<rect x="381" y="440" width="28" height="28" rx="4" fill="#495057"/>
<line x1="395" y1="438" x2="395" y2="441" stroke="#868e96" stroke-width="4"/>
<path d="M381.0,468 L365.0,503 L425.0,503 L409.0,468 Z" fill="#5c6b80"/>
<path d="M371.0,505 Q365.0,548 395,578 Q425.0,548 419.0,505 Z" fill="url(#flame)"/>
<circle cx="424" cy="255" r="2.5" fill="#e6edf7"/><polyline points="424,255 451,255 459,255" fill="none" stroke="#8fa3bf" stroke-width="1"/>
<text x="465" y="252" fill="#e6edf7" font-size="12.5">Fuel tank</text>
<text x="465" y="267" fill="#8fa3bf" font-size="11.5">e.g. kerosene, methane</text>
<circle cx="424" cy="355" r="2.5" fill="#e6edf7"/><polyline points="424,355 451,355 459,355" fill="none" stroke="#8fa3bf" stroke-width="1"/>
<text x="465" y="352" fill="#e6edf7" font-size="12.5">Oxidizer tank</text>
<text x="465" y="367" fill="#8fa3bf" font-size="11.5">usually liquid oxygen</text>
<circle cx="406" cy="427" r="2.5" fill="#e6edf7"/><polyline points="406,427 451,420 459,420" fill="none" stroke="#8fa3bf" stroke-width="1"/>
<text x="465" y="424" fill="#e6edf7" font-size="12.5">Turbopump</text>
<circle cx="409" cy="454" r="2.5" fill="#e6edf7"/><polyline points="409,454 451,452 459,452" fill="none" stroke="#8fa3bf" stroke-width="1"/>
<text x="465" y="456" fill="#e6edf7" font-size="12.5">Combustion chamber</text>
<circle cx="417" cy="488" r="2.5" fill="#e6edf7"/><polyline points="417,488 451,488 459,488" fill="none" stroke="#8fa3bf" stroke-width="1"/>
<text x="465" y="492" fill="#e6edf7" font-size="12.5">Nozzle</text>
<line x1="335" y1="572" x2="565" y2="572" stroke="#22395c"/>
<text x="335" y="594" fill="#8fa3bf" font-size="13">Specific impulse</text><text x="565" y="594" fill="#e6edf7" font-size="13" font-weight="600" text-anchor="end">~300–450 s</text>
<text x="335" y="614" fill="#8fa3bf" font-size="13">Throttle / restart</text><text x="565" y="614" fill="#e6edf7" font-size="13" font-weight="600" text-anchor="end">Yes</text>
<rect x="600" y="105" width="270" height="525" rx="14" fill="#101f36" stroke="#22395c" stroke-width="1.5"/>
<text x="620" y="138" fill="#e6edf7" font-size="20" font-weight="700">Hybrid</text>
<text x="620" y="158" fill="#8fa3bf" font-size="12.5">Solid fuel, liquid or gas oxidizer</text>
<path d="M645,205 C645,183 668,178 680,170 C692,178 715,183 715,205 Z" fill="#c92a2a"/>
<rect x="645" y="205" width="70" height="250" fill="#c7d0dc"/>
<rect x="651" y="211" width="58" height="100" rx="10" fill="#4dabf7"/>
<line x1="680" y1="311" x2="680" y2="336" stroke="#4dabf7" stroke-width="4"/>
<path d="M670,317 L690,329 L690,317 L670,329 Z" fill="#ffd43b"/>
<rect x="651" y="338" width="58" height="117" fill="#ff922b"/>
<rect x="672" y="338" width="16" height="117" fill="#0b1628"/>
<line x1="680" y1="342" x2="680" y2="450" stroke="#4dabf7" stroke-width="2.5" stroke-dasharray="5 4"/>
<line x1="672" y1="350" x2="672" y2="455" stroke="#ffd43b" stroke-width="2.5"/><line x1="688" y1="350" x2="688" y2="455" stroke="#ffd43b" stroke-width="2.5"/>
<path d="M666.0,455 L650.0,490 L710.0,490 L694.0,455 Z" fill="#5c6b80"/>
<path d="M656.0,492 Q650.0,535 680,565 Q710.0,535 704.0,492 Z" fill="url(#flame)"/>
<circle cx="709" cy="255" r="2.5" fill="#e6edf7"/><polyline points="709,255 736,255 744,255" fill="none" stroke="#8fa3bf" stroke-width="1"/>
<text x="750" y="252" fill="#e6edf7" font-size="12.5">Oxidizer tank</text>
<text x="750" y="267" fill="#8fa3bf" font-size="11.5">e.g. nitrous oxide</text>
<circle cx="690" cy="323" r="2.5" fill="#e6edf7"/><polyline points="690,323 736,323 744,323" fill="none" stroke="#8fa3bf" stroke-width="1"/>
<text x="750" y="320" fill="#e6edf7" font-size="12.5">Valve</text>
<text x="750" y="335" fill="#8fa3bf" font-size="11.5">controls the thrust</text>
<circle cx="709" cy="380" r="2.5" fill="#e6edf7"/><polyline points="709,380 736,380 744,380" fill="none" stroke="#8fa3bf" stroke-width="1"/>
<text x="750" y="377" fill="#e6edf7" font-size="12.5">Solid fuel</text>
<text x="750" y="392" fill="#8fa3bf" font-size="11.5">e.g. HTPB, paraffin</text>
<circle cx="688" cy="425" r="2.5" fill="#e6edf7"/><polyline points="688,425 736,425 744,425" fill="none" stroke="#8fa3bf" stroke-width="1"/>
<text x="750" y="422" fill="#e6edf7" font-size="12.5">Port</text>
<text x="750" y="437" fill="#8fa3bf" font-size="11.5">where the fuel burns</text>
<circle cx="702" cy="475" r="2.5" fill="#e6edf7"/><polyline points="702,475 736,480 744,480" fill="none" stroke="#8fa3bf" stroke-width="1"/>
<text x="750" y="484" fill="#e6edf7" font-size="12.5">Nozzle</text>
<line x1="620" y1="572" x2="850" y2="572" stroke="#22395c"/>
<text x="620" y="594" fill="#8fa3bf" font-size="13">Specific impulse</text><text x="850" y="594" fill="#e6edf7" font-size="13" font-weight="600" text-anchor="end">~250–300 s</text>
<text x="620" y="614" fill="#8fa3bf" font-size="13">Throttle / restart</text><text x="850" y="614" fill="#e6edf7" font-size="13" font-weight="600" text-anchor="end">Yes</text>
</svg>